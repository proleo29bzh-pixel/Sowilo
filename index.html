<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sowilo</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#060B18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sowilo">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    try { var t = (JSON.parse(localStorage.getItem("cerveau-v1") || "{}").theme) || {}; } catch (e) { var t = {}; }
    document.documentElement.dataset.mode = t.mode === "sombre" || (t.mode !== "clair" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    // la page d'entrée prend le thème choisi dans l'appli (Bleu nuit par défaut)
    var TH = { systeme: ["#060B18", "#4FA3FF", "#9CCBFF"], noirblanc: ["#000000", "#FFFFFF", "#BDBDBD"], navy: ["#0B1324", "#B87333", "#E0A878"],
      rougevert: ["#160C0C", "#2E8B57", "#7FD1A0"], vertrouge: ["#08140F", "#C0392B", "#F08A7E"], hiver: ["#071426", "#A9D3F0", "#DCEEFF"],
      printemps: ["#140E10", "#E07A9B", "#F6B7CB"], ete: ["#071C24", "#F2A33A", "#FFD38A"], automne: ["#160C06", "#C8641E", "#F0A868"] }[t.jeu] || ["#060B18", "#4FA3FF", "#9CCBFF"];
    var R = document.documentElement.style; R.setProperty("--fond", "#06080F"); R.setProperty("--acc", "#FFB347"); R.setProperty("--acc2", "#FFD27A");
    // accès déjà mémorisé : on n'affiche pas le formulaire, juste le logo pendant le chargement
    try { if (localStorage.getItem("cerveau-acces")) document.documentElement.classList.add("auto"); } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png?v=202611110259">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=202611110259">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style id="acces-style">
    html, body { margin: 0; height: 100%; background: var(--fond, #060B18); }
    #acces { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; overflow: hidden; color: #EAF2FF;
      font: 15px/1.45 Manrope, system-ui, sans-serif; -webkit-text-size-adjust: 100%;
      background: radial-gradient(80% 55% at 50% 22%, color-mix(in srgb, var(--acc) 26%, transparent), transparent 70%), var(--fond, #060B18); }
    #acces .boite { position: relative; width: 100%; max-width: 340px; text-align: center; }
    #acces svg { width: 150px; height: 150px; display: block; margin: 0 auto; overflow: visible; filter: drop-shadow(0 0 20px rgba(255,179,71,.45)); }
    #acces .soleil { transform-origin: 50px 50px; animation: pulse 3.4s ease-in-out infinite; }
    #acces .rayons { transform-origin: 50px 50px; animation: tourne 24s linear infinite; }
    #acces .perso { animation: flotte 3.4s ease-in-out infinite; }
    #acces .oeil { transform-box: fill-box; transform-origin: center; animation: cligne 4.5s infinite; }
    @keyframes pulse { 50% { transform: scale(1.1); opacity: .8; } }
    @keyframes tourne { to { transform: rotate(360deg); } }
    @keyframes flotte { 50% { transform: translateY(-4px); } }
    @keyframes cligne { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @media (prefers-reduced-motion: reduce) { #acces svg * { animation: none !important; } }
    #acces h1 { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 46px; letter-spacing: .04em; line-height: 1; margin: 20px 0 8px;
      text-shadow: 0 0 22px color-mix(in srgb, var(--acc) 60%, transparent); }
    #acces .slogan { color: var(--acc2); font-weight: 700; margin: 0; }
    #acces p.sous { color: #8D9BB5; margin: 4px 0 26px; font-size: 14px; }
    #acces input { width: 100%; box-sizing: border-box; font: inherit; font-size: 17px; padding: 15px 16px; border-radius: 12px; text-align: center; color: #fff;
      background: rgba(255,255,255,.05); border: 1px solid color-mix(in srgb, var(--acc) 55%, transparent); outline: none; }
    #acces input:focus { border-color: var(--acc2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 30%, transparent); }
    #acces input::placeholder { color: #6F7E99; }
    #acces button { width: 100%; margin-top: 10px; font: inherit; font-weight: 800; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; padding: 15px; border-radius: 12px; border: 0;
      background: var(--acc); color: #050914; cursor: pointer; box-shadow: 0 0 24px color-mix(in srgb, var(--acc) 45%, transparent); }
    #acces button:disabled { opacity: .5; }
    #acces .err { color: #FF9A9A; min-height: 22px; margin: 10px 0 0; font-weight: 700; }
    #acces .saves { margin: 14px 0 0; text-align: left; font-size: 14px; }
    #acces .saves b { display: block; color: var(--acc2); font-size: 13px; letter-spacing: .04em; margin-bottom: 6px; }
    #acces .saves label { display: flex; gap: 10px; align-items: center; padding: 10px 12px; margin-top: 6px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); cursor: pointer; }
    #acces .saves label:has(input:checked) { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 14%, transparent); }
    #acces .saves input { width: auto; padding: 0; accent-color: var(--acc); box-shadow: none; }
    #acces .saves span small { display: inline; margin: 0; color: #8D9BB5; }
    #acces small { display: block; margin-top: 16px; color: #67748D; font-size: 12px; }
    #acces .logo { width: 132px; height: 132px; border-radius: 30px; display: block; margin: 0 auto; box-shadow: 0 0 34px rgba(255,179,71,.45); animation: pulse-logo 2.6s ease-in-out infinite; }
    @keyframes pulse-logo { 50% { box-shadow: 0 0 54px rgba(255,179,71,.7); } }
    /* accès mémorisé : pas de formulaire, juste le logo et « Chargement… » */
    html.auto #acces .boite > :not(.logo):not(h1) { display: none; }
    html.auto #acces .boite::after { content: "Chargement…"; display: block; margin-top: 10px; color: #FFD27A; font-weight: 700; letter-spacing: .1em; }
  </style>
</head>
<body>
  <div id="acces">
    <form class="boite" id="acces-form">
      <img class="logo" src="icons/icon-512.png?v=202611110259" alt="">
      <h1>Sowilo</h1>
      <p class="slogan">Ta vie, en mode jeu.</p>
      <p class="sous">Version test privée · entre ton code d'accès.</p>
      <input id="acces-mdp" type="password" autocomplete="current-password" placeholder="Code d'accès" required>
      <button id="acces-btn">Entrer dans le jeu</button>
      <div class="err" id="acces-err"></div>
      <div class="saves" id="acces-saves"></div>
      <small>Pas encore de code ? Demande-le à Léo.</small>
    </form>
  </div>
<script>
// Page d'accès : l'appli est publiée chiffrée (AES-GCM). La clé de l'appli est chiffrée une fois par testeur
// avec une clé dérivée de son mot de passe (PBKDF2). Sans mot de passe valide, rien n'est lisible.
(async () => {
  const VERSION = "202611110259", ITER = 250000, MEMO = "cerveau-acces";
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const enB64 = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
  const err = document.getElementById("acces-err"), btn = document.getElementById("acces-btn");
  let paquet;
  try { paquet = await (await fetch("app.enc?v=" + VERSION, { cache: "no-cache" })).json(); }
  catch (e) { try { paquet = await (await fetch("app.enc?v=" + VERSION)).json(); } catch (e2) { err.textContent = "Pas de connexion. Réessaie dans un instant."; return; } }

  async function cleTesteur(rawKek) { return crypto.subtle.importKey("raw", rawKek, "AES-GCM", false, ["decrypt"]); }
  async function ouvrir(entree, kek) {
    const clair = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(entree.iv) }, kek, b64(entree.cle));
    return JSON.parse(new TextDecoder().decode(clair));            // { k: clé de l'appli (base64), nom }
  }
  async function lancer(acces) {
    const cle = await crypto.subtle.importKey("raw", b64(acces.k), "AES-GCM", false, ["decrypt"]);
    const clair = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(paquet.iv) }, cle, b64(paquet.data));
    const app = JSON.parse(new TextDecoder().decode(clair));
    window.CERVEAU_TESTEUR = acces.nom;
    window.addEventListener("error", (e) => panne(e.message + (e.lineno ? " (ligne " + e.lineno + ")" : "")));
    document.getElementById("acces-style").remove();
    const style = document.createElement("style");
    style.textContent = app.css;
    document.head.appendChild(style);
    document.body.innerHTML = app.body;
    for (const code of app.scripts) {
      const s = document.createElement("script");
      s.textContent = code;
      document.body.appendChild(s);
    }
  }
  // Affiche l'erreur au lieu d'un écran vide, avec de quoi repartir (les données de l'appli ne sont pas touchées)
  window.panne = function (msg) {
    if (document.getElementById("panne")) return;
    const d = document.createElement("div");
    d.id = "panne";
    d.style.cssText = "position:fixed;left:12px;right:12px;bottom:90px;z-index:99;background:#7A1E1E;color:#fff;padding:14px;border-radius:14px;font:14px/1.4 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4)";
    d.innerHTML = "<b>Oups, un bug</b><br>Fais une capture et envoie-la à Léo :<br><code style='font-size:12px;word-break:break-word'></code><br>" +
      "<button style='margin-top:10px;padding:10px 14px;border:0;border-radius:99px;font-weight:800'>Réinitialiser l'accès</button>";
    d.querySelector("code").textContent = String(msg).slice(0, 300);
    d.querySelector("button").onclick = async () => {
      localStorage.removeItem(MEMO);
      try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); for (const k of await caches.keys()) await caches.delete(k); } catch (x) {}
      location.reload();
    };
    document.body.appendChild(d);
  };
  async function lancerSur(acces) { try { await lancer(acces); } catch (e) { panne("Démarrage : " + (e.message || e)); } }
  // Accès déjà mémorisé sur ce téléphone (clé dérivée du mot de passe, jamais le mot de passe lui-même)
  try {
    const memo = JSON.parse(localStorage.getItem(MEMO) || "null");
    const e = memo && paquet.testeurs.find((x) => x.id === memo.id);
    if (e) { const acces = await ouvrir(e, await cleTesteur(b64(memo.kek))); await lancerSur(acces); return; }
    if (memo) localStorage.removeItem(MEMO);   // accès retiré
  } catch (e) { localStorage.removeItem(MEMO); }
  document.documentElement.classList.remove("auto");   // pas d'accès valable : on montre le formulaire

  // Les progressions déjà enregistrées sur ce téléphone : on montre le prénom, la personne choisit la sienne
  const saves = Object.keys(localStorage).filter((k) => k.startsWith("cerveau-v1") || k.startsWith("cerveau-sauvegarde-")).map((k) => {
    try { const d = JSON.parse(localStorage.getItem(k)), t = +(k.match(/sauvegarde-(\d+)/) || [])[1];
      return { k, nom: d?.joueur?.prenom || d?.profil?.prenom || "", ko: Math.max(1, Math.round(localStorage.getItem(k).length / 1024)), date: t ? new Date(t).toLocaleDateString("fr-FR") : "" };
    } catch (e) { return null; }
  }).filter((x) => x && x.nom).sort((a, b) => b.ko - a.ko);
  const zone = document.getElementById("acces-saves");
  if (saves.length) {
    const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    zone.innerHTML = `<b>${saves.length > 1 ? "Ta progression sur ce téléphone : choisis la tienne" : "Progression retrouvée sur ce téléphone"}</b>` +
      saves.map((x, i) => `<label><input type="radio" name="save" value="${esc(x.k)}"${i ? "" : " checked"}><span>${esc(x.nom)} <small>· ${x.ko} Ko${x.date ? " · sauvegarde du " + x.date : ""}</small></span></label>`).join("");
  }
  document.getElementById("acces-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const choix = document.querySelector('#acces-saves input[name="save"]:checked');
    try { if (choix) localStorage.setItem("sowilo-choix", choix.value); } catch (x) {}
    const mdp = document.getElementById("acces-mdp").value.trim().toLowerCase().replace(/[‐-―−]/g, "-").replace(/\s+/g, "");
    if (!mdp) return;
    btn.disabled = true; btn.textContent = "Vérification…"; err.textContent = "";
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveBits"]);
    for (const e of paquet.testeurs) {
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(e.sel), iterations: ITER }, base, 256);
      try {
        const acces = await ouvrir(e, await cleTesteur(bits));
        try { localStorage.setItem(MEMO, JSON.stringify({ id: e.id, kek: enB64(bits) })); } catch (x) {}
        return lancerSur(acces);
      } catch (x) { /* pas ce testeur */ }
    }
    btn.disabled = false; btn.textContent = "Entrer dans le jeu";
    err.textContent = "Code incorrect.";
  });
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
// demande au navigateur de ne jamais effacer les données de l'appli pour faire de la place
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
</script>
</body>
</html>
